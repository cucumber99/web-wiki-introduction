<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오이 소개</title>
    <link rel="stylesheet" href="./css/main.css" />

  </head>
  <body>
    <div id="app">
      <header>
        <h1 class="logo">
          <img src="./images/header-logo.png" alt="행성이 로고" width="166" height="147" />
          <span class="text">크루 위키</span>
        </h1>
      </header>
      <main>
        <h2 class="title">오이</h2>
        <hr />
        <section>
          <h3 class="subtitle">자기소개</h3>
          <p>
            안녕하세요? 오이입니다.
          </p>
        </section>
        <section>
          <h3 class="subtitle">내가 좋아하는 순간들</h3>
          <div class="gallery">
            <img src="./images/5.JPG" alt="산">
            <img src="./images/2.JPEG" alt="요리">
            <img src="./images/3.JPEG" alt="청와대">
            <img src="./images/4.JPEG" alt="바다">
            <img src="./images/1.jpg" alt="별">
            <img src="./images/6.JPG" alt="여행">
            <img src="./images/7.JPEG" alt="자전거">
            <img src="./images/8.jpg" alt="바다2">
            <img src="./images/9.JPEG" alt="계곡">
          </div>
        </section>
        <section>
          <h3 class="subtitle">내가 좋아하는 것들</h3>
          <article>
            <h4>인생 작품</h4>
            <div class="thumbnail">
              <img
                src="./images/evangelion.jpg"
                width="300"
                alt="에반게리온 포스터"
              />
            </div>
            <p>
              방구석 히키코모리들을 밖으로 내보내려는 감독의 처절한 몸부림
            </p>
            <p>
              에반게리온 안 본 뇌 삽니다.
            </p>
          </article>
          <article>
            <h4>인생 음악</h4>
            <div class="thumbnail">
              <img
                src="./images/blond.jpeg"
                width="300"
                alt="블론드"
              />
              <img
                src="./images/cigarettes.png"
                width="300"
                alt="섹후땡"
              />
              <img
                src="./images/powerandre.png"
                width="300"
                alt="실리카겔"
              />
            </div>
          </article>
        </section>

        <section>
          <div class="comment-writing-container">
            <form>
              <fieldset>
                <legend>댓글 쓰기</legend>
                <textarea
                  id="commentInput"
                  placeholder="댓글을 남겨보세요!"></textarea>
                <div class="comment-buttons">
                  <button type="button" id="submitComment">등록</button>
                  <button type="reset">취소</button>
                </div>
              </fieldset>
            </form>
          </div>
          <ul class="comment-list" id="commentList">
            <li>
              <div class="comment-item">
                <div class="comment-author">
                  <img src="./images/comment-author-icon.png" alt="사용자 프로필 이미지" />
                  <span>방문자</span>
                </div>
                <div class="comment-content">
                  잘 보고 갑니다~
                </div>
              </div>
            </li>
          </ul>
        </section>

        <footer>
          <img src="./images/footer-logo.png" width="180" alt="우아한테크코스 로고" />
          <p>&copy; 우아한테크코스 All Rights reserved.</p>
        </footer>
      </main>
      <aside class="right-sidebar">
        <div class="profile-image">오이 프로필 이미지</div>
        <nav>
          <h2>Contents</h2>
          <ol class="contents">
            <li>
              <a href="#">자기소개</a>
            </li>
            <li>
              <a href="#">내가 좋아하는 순간들</a>
            </li>
            <li>
              <a href="#">내가 좋아하는 것들</a>
            </li>
          </ol>
        </nav>
      </aside>
    </div>
  </body>
  <script src="./js/index.js"></script>
</html>
